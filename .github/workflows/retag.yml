name: retag
on:
  workflow_dispatch:
permissions:
  packages: write
jobs:
  retag:
    runs-on: ubuntu-latest
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          docker buildx imagetools create \
            --tag ghcr.io/canary17x/handbrake-psy:latest \
            ghcr.io/canary17x/handbrake-psy:tritium
